version: '3.8'

services:
  # PostgreSQL database for LangGraph checkpointing
  postgres:
    image: postgres:15-alpine
    container_name: scientific-articles-postgres
    environment:
      POSTGRES_DB: scientific_articles_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Scientific Articles Engine application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: scientific-articles-app
    environment:
      # LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Database Configuration
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: scientific_articles_engine
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changeme}

      # Logging
      LOG_LEVEL: INFO
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    command: ["--help"]

  # Development container (with mounted source code)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: scientific-articles-dev
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: scientific_articles_engine
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-changeme}
      LOG_LEVEL: DEBUG
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config.yaml:/app/config.yaml
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - dev
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
